name: Build isolated staging package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require distinct staging Supabase credentials
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/build-staging.mjs
      - name: Upload staging website (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: coach-copilot-staging
          path: dist-staging/
          retention-days: 7
