name: Coach Copilot reliability checks
on:
  push:
    branches:
      - fix/session-position-safety-v344
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated tests (no Supabase credentials)
        run: |
          node tests/reliability.test.cjs
          node tests/offline.test.cjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Mobile browser and offline recovery
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/coach-copilot-server.log 2>&1 &
          npx playwright test tests/browser.spec.cjs --browser chromium --workers 1 --reporter=line
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 3
