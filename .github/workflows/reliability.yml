name: Coach Copilot reliability checks
on:
  push:
    branches:
      - fix/session-position-safety-v344
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated tests (no Supabase credentials)
        run: node tests/reliability.test.cjs
