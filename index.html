<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coach Copilot V3</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--border:#d1d5db}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:900px;margin:auto;padding:12px}.top,.row{display:flex;gap:10px;align-items:center}.top{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin:12px 0}
button,input,select,textarea{font:inherit;border:1px solid var(--border);border-radius:9px;padding:9px;background:#fff}
button{cursor:pointer}.primary,.active{background:#111827;color:white}.danger{color:#b91c1c}
.tabs{display:flex;gap:6px;overflow:auto}.view{display:none}.view.activeView{display:block}
.muted{color:var(--muted)}.spread{justify-content:space-between}.hidden{display:none}
label{display:block;margin:9px 0}label input,label textarea,label select{display:block;width:100%;margin-top:4px}
.exercise{border:1px solid var(--border);border-radius:12px;padding:10px;margin:10px 0}
.setrow{display:grid;grid-template-columns:40px 1fr 1fr 1fr 38px;gap:5px;align-items:center;margin:5px 0}
.header{font-size:12px;color:var(--muted)}.client,.history{border-top:1px solid #e5e7eb;padding:10px 0}
h1,h2,h3{margin:4px 0}@media(min-width:650px){.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}}

#authGate{position:fixed;inset:0;background:#f3f4f6;z-index:1000;display:flex;align-items:center;justify-content:center;padding:18px}
#authGate.hidden{display:none}.authCard{width:min(420px,100%);background:white;border:1px solid var(--border);border-radius:16px;padding:20px}.authCard input{width:100%;margin:5px 0 12px}.authError{color:#b91c1c;margin-top:10px}.accountBtn{margin-left:8px;padding:6px 9px}
</style>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
</head>
<body>
<div id="authGate">
 <div class="authCard">
  <h2>Coach Copilot</h2>
  <p class="muted">Sign in to your Coach Copilot account.</p>
  <label>Email<input id="loginEmail" type="email" autocomplete="email"></label>
  <label>Password<input id="loginPassword" type="password" autocomplete="current-password"></label>
  <button id="loginButton" class="primary" style="width:100%">Sign in</button>
  <div id="authError" class="authError"></div>
 </div>
</div>
<div class="app">
 <div class="top">
  <div><h1>Coach Copilot</h1><div class="muted">V3 cloud preview</div></div>
  <div id="accountBar" class="muted"></div>
 </div>
 <div style="display:none"><button id="coachBtn"></button><button id="clientBtn"></button></div>
 <div class="tabs card">
  <button class="tab active" data-v="clients">Clients</button>
  <button class="tab" data-v="programme">Programme</button>
  <button class="tab" data-v="workout">Workout</button>
  <button class="tab" data-v="history">History</button>
 </div>

 <section id="clients" class="view activeView">
  <div class="card">
   <div class="row spread"><div><h2>Clients</h2><div class="muted">Select the client you are programming.</div></div><button id="addClient" class="primary">+ Add</button></div>
   <div id="clientsList"></div>
  </div>
  <div id="clientForm" class="card hidden">
   <h3>Add client</h3>
   <label>Name<input id="cName"></label>
   <label>Goal<input id="cGoal"></label>
   <label>Context<textarea id="cContext"></textarea></label>
   <button id="saveClient" class="primary">Save</button>
  </div>
 </section>

 <section id="programme" class="view">
  <div class="card">
   <div class="row spread">
    <div>
      <h2>Programme Builder</h2>
      <div id="progFor" class="muted"></div>
    </div>
   </div>

   <div class="grid">
    <label>Programme
      <select id="programmeSelect"></select>
    </label>
    <label>Week
      <select id="weekSelect"></select>
    </label>
    <label>Session
      <select id="sessionSelect"></select>
    </label>
   </div>

   <div class="row" style="flex-wrap:wrap;margin-bottom:10px">
    <button id="newProgramme">+ Programme</button>
    <button id="createNextWeek" class="primary">Create Next Week</button>
    <button id="newSession">+ Session</button>
    <button id="renameProgramme">Rename programme</button>
    <button id="renameSession">Rename session</button>
    <button id="deleteSession" class="danger">Delete session</button>
   </div>

   <div id="programmeCreator" class="card hidden" style="margin:8px 0">
    <label>New programme name<input id="newProgrammeName" placeholder="e.g. 8-Week Strength Block"></label>
    <div class="row">
      <button id="saveNewProgramme" class="primary">Create programme</button>
      <button id="cancelNewProgramme">Cancel</button>
    </div>
   </div>

   <div id="sessionCreator" class="card hidden" style="margin:8px 0">
    <label>New session name<input id="newSessionName" placeholder="e.g. Upper B"></label>
    <div class="row">
      <button id="saveNewSession" class="primary">Create session</button>
      <button id="cancelNewSession">Cancel</button>
    </div>
   </div>

   <div id="renameProgrammeBox" class="card hidden" style="margin:8px 0">
    <label>Programme name<input id="renameProgrammeName"></label>
    <div class="row">
      <button id="saveRenameProgramme" class="primary">Save</button>
      <button id="cancelRenameProgramme">Cancel</button>
    </div>
   </div>

   <div id="renameSessionBox" class="card hidden" style="margin:8px 0">
    <label>Session name<input id="renameSessionName"></label>
    <div class="row">
      <button id="saveRenameSession" class="primary">Save</button>
      <button id="cancelRenameSession">Cancel</button>
    </div>
   </div>

   <div class="row spread">
    <div><strong id="currentSessionTitle">Session</strong></div>
    <button id="addExercise" class="primary">+ Exercise</button>
   </div>
   <div id="exercises"></div>
  </div>
 </section>

 <section id="workout" class="view">
  <div class="card">
   <div class="row spread"><div><h2>Workout</h2><div id="workoutFor" class="muted"></div></div><button id="startWorkout" class="primary">Start</button></div>

   <div id="clientWorkoutChooser" class="hidden">
    <div class="grid">
     <label>Programme
      <select id="clientProgrammeSelect"></select>
     </label>
     <label>Week
      <select id="clientWeekSelect"></select>
     </label>
     <label>Session
      <select id="clientSessionSelect"></select>
     </label>
    </div>
   </div>

   <div id="prBanner" class="card hidden" style="border-width:2px">
    <strong id="prTitle">New PR</strong>
    <div id="prMessage" class="muted"></div>
   </div>
   <div id="workoutArea"><p class="muted">Build a programme first.</p></div>
   <div id="finishBox" class="hidden">
    <label>Energy<select id="energy"><option>Low</option><option selected>Normal</option><option>High</option></select></label>
    <label>Sleep last night
      <select id="sleep">
        <option value="<5h">&lt;5 hours</option>
        <option value="5-6h">5–6 hours</option>
        <option value="6-7h" selected>6–7 hours</option>
        <option value="7-8h">7–8 hours</option>
        <option value="8h+">8+ hours</option>
      </select>
    </label>
    <label>Sleep quality
      <select id="sleepQuality">
        <option>Poor</option>
        <option selected>Normal</option>
        <option>Good</option>
      </select>
    </label>
    <label>Pain?<select id="pain"><option selected>No</option><option>Yes</option></select></label>
    <div id="painDetails" class="hidden">
      <label>Where?<input id="painWhere" placeholder="e.g. right knee"></label>
      <label>Pain severity (0–10)<input id="painSeverity" type="number" min="0" max="10" inputmode="numeric"></label>
      <label>Did it affect training?
        <select id="painEffect"><option>No</option><option>Slightly</option><option>Significantly</option></select>
      </label>
    </div>
    <label>Notes<textarea id="notes"></textarea></label>
    <button id="finishWorkout" class="primary">Finish session</button>
   </div>
  </div>
 </section>

 <section id="history" class="view">
 <div class="card">
  <h2>History</h2>
  <div id="historyFor" class="muted"></div>
  <div id="adherenceSummary" class="card" style="margin:10px 0"></div>
  <div id="historyList"></div>
 </div>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";
var SUPABASE_URL="https://ysalexpeiynndagqufpl.supabase.co";
var SUPABASE_PUBLISHABLE_KEY="sb_publishable_hzOjhsD7DYoQy2g9Jg1ufA_T8MBs9im";
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
var authProfile=null;

function uid(){return "id_"+Date.now()+"_"+Math.floor(Math.random()*1000000);}
var KEY="coach_copilot_v13";
var state;
try{state=JSON.parse(localStorage.getItem(KEY));}catch(e){state=null;}

function starterProgramme(){
 var firstSession={id:uid(),name:"Upper A",exercises:[]};
 var firstWeek={id:uid(),number:1,name:"Week 1",sessions:[firstSession]};
 return {
   id:uid(),
   name:"Current Programme",
   weeks:[firstWeek]
 };
}

if(!state){
 state={
   role:"coach",
   clients:[{
     id:uid(),
     name:"Mark",
     goal:"Strength + hypertrophy",
     context:"Client zero",
     programmes:[starterProgramme()],
     selectedProgrammeId:null,
     selectedWeekId:null,
     selectedSessionId:null
   }],
   selected:null,
   history:[]
 };
}
if(!state.selected&&state.clients.length)state.selected=state.clients[0].id;
if(!state.clientViewSelection)state.clientViewSelection={};

function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function el(id){return document.getElementById(id)}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}

function client(){
 for(var i=0;i<state.clients.length;i++)if(state.clients[i].id===state.selected)return state.clients[i];
 return null;
}
function ensureClientData(c){
 if(!c) return;
 if(!c.programmes || !c.programmes.length) c.programmes=[starterProgramme()];

 // Migrate older programmes that had sessions directly into Week 1.
 for(var mi=0;mi<c.programmes.length;mi++){
   var mp=c.programmes[mi];
   if(!mp.weeks){
     var oldSessions=(mp.sessions&&mp.sessions.length)?mp.sessions:[{id:uid(),name:"Upper A",exercises:[]}];
     mp.weeks=[{id:uid(),number:1,name:"Week 1",sessions:oldSessions}];
     delete mp.sessions;
   }
   if(!mp.weeks.length)mp.weeks=[{id:uid(),number:1,name:"Week 1",sessions:[{id:uid(),name:"Upper A",exercises:[]}]}];
 }

 if(!c.selectedProgrammeId || !getProgramme(c,c.selectedProgrammeId)) c.selectedProgrammeId=c.programmes[0].id;
 var p=getProgramme(c,c.selectedProgrammeId);

 if(!c.selectedWeekId || !getWeek(p,c.selectedWeekId)){
   c.selectedWeekId=p.weeks[p.weeks.length-1].id;
 }
 var w=getWeek(p,c.selectedWeekId);

 if(!w.sessions || !w.sessions.length)w.sessions=[{id:uid(),name:"Upper A",exercises:[]}];
 if(!c.selectedSessionId || !getSession(w,c.selectedSessionId)) c.selectedSessionId=w.sessions[0].id;
}
function getProgramme(c,id){
 if(!c||!c.programmes)return null;
 for(var i=0;i<c.programmes.length;i++)if(c.programmes[i].id===id)return c.programmes[i];
 return null;
}
function getWeek(p,id){
 if(!p||!p.weeks)return null;
 for(var i=0;i<p.weeks.length;i++)if(p.weeks[i].id===id)return p.weeks[i];
 return null;
}
function getSession(w,id){
 if(!w||!w.sessions)return null;
 for(var i=0;i<w.sessions.length;i++)if(w.sessions[i].id===id)return w.sessions[i];
 return null;
}
function programme(){var c=client();ensureClientData(c);return c?getProgramme(c,c.selectedProgrammeId):null}
function week(){var c=client(),p=programme();return c&&p?getWeek(p,c.selectedWeekId):null}
function session(){var c=client(),w=week();return c&&w?getSession(w,c.selectedSessionId):null}

function clientViewIds(){
 var c=client(); if(!c)return null;
 ensureClientData(c);
 if(!state.clientViewSelection[c.id]){
   state.clientViewSelection[c.id]={programmeId:c.selectedProgrammeId,weekId:c.selectedWeekId,sessionId:c.selectedSessionId};
 }
 var sel=state.clientViewSelection[c.id];
 var p=getProgramme(c,sel.programmeId);
 if(!p){sel.programmeId=c.programmes[0].id;p=c.programmes[0];}
 var w=getWeek(p,sel.weekId);
 if(!w){sel.weekId=p.weeks[p.weeks.length-1].id;w=getWeek(p,sel.weekId);}
 var s=getSession(w,sel.sessionId);
 if(!s){sel.sessionId=w.sessions[0].id;s=w.sessions[0];}
 return {c:c,p:p,w:w,s:s,sel:sel};
}

function show(v){
 var vs=document.querySelectorAll(".view"),ts=document.querySelectorAll(".tab"),i;
 for(i=0;i<vs.length;i++)vs[i].className="view";
 for(i=0;i<ts.length;i++)ts[i].className="tab";
 el(v).className="view activeView";
 var t=document.querySelector('.tab[data-v="'+v+'"]');if(t)t.className="tab active";
 render();
}
var tabs=document.querySelectorAll(".tab");
for(var ti=0;ti<tabs.length;ti++)tabs[ti].onclick=function(){show(this.getAttribute("data-v"))};

el("coachBtn").onclick=function(){state.role="coach";save();renderRole();show("clients")};
el("clientBtn").onclick=function(){state.role="client";save();renderRole();show("workout")};

function renderRole(){
 el("coachBtn").className=state.role==="coach"?"active":"";
 el("clientBtn").className=state.role==="client"?"active":"";
 var coachOnlyTabs=document.querySelectorAll('.tab[data-v="clients"],.tab[data-v="programme"]');
 for(var i=0;i<coachOnlyTabs.length;i++)coachOnlyTabs[i].style.display=state.role==="coach"?"":"none";
 var historyTab=document.querySelector('.tab[data-v="history"]');
 if(historyTab)historyTab.style.display="";
}

el("addClient").onclick=function(){el("clientForm").className="card"};
el("saveClient").onclick=function(){
 var n=el("cName").value;if(!n){alert("Enter a name");return}
 var c={id:uid(),name:n,goal:el("cGoal").value,context:el("cContext").value,programmes:[starterProgramme()],selectedProgrammeId:null,selectedWeekId:null,selectedSessionId:null};
 ensureClientData(c);
 state.clients.push(c);state.selected=c.id;el("clientForm").className="card hidden";save();render();
};

function renderClients(){
 var out="",i,c;
 for(i=0;i<state.clients.length;i++){
  c=state.clients[i];
  out+='<div class="client row spread"><div><b>'+esc(c.name)+'</b><div class="muted">'+esc(c.goal)+'</div></div><button data-client="'+c.id+'" class="'+(c.id===state.selected?'primary':'')+'">'+(c.id===state.selected?'Selected':'Select')+'</button></div>';
 }
 el("clientsList").innerHTML=out;
 var bs=el("clientsList").getElementsByTagName("button");
 for(i=0;i<bs.length;i++)bs[i].onclick=function(){
   state.selected=this.getAttribute("data-client");
   ensureClientData(client());
   save();render();
 };
}

el("newProgramme").onclick=function(){
 el("programmeCreator").className="card";
 el("newProgrammeName").value="";
};
el("cancelNewProgramme").onclick=function(){el("programmeCreator").className="card hidden";};
el("saveNewProgramme").onclick=function(){
 var c=client(); if(!c)return;
 var name=el("newProgrammeName").value.trim();
 if(!name){alert("Enter a programme name.");return;}
 var first={id:uid(),name:"Session 1",exercises:[]};
 var firstWeek={id:uid(),number:1,name:"Week 1",sessions:[first]};
 var p={id:uid(),name:name,weeks:[firstWeek]};
 c.programmes.push(p); c.selectedProgrammeId=p.id; c.selectedWeekId=firstWeek.id; c.selectedSessionId=first.id;
 el("programmeCreator").className="card hidden";
 save();renderProgramme();renderWorkout();
};

el("newSession").onclick=function(){
 el("sessionCreator").className="card";
 el("newSessionName").value="";
};
el("cancelNewSession").onclick=function(){el("sessionCreator").className="card hidden";};
el("saveNewSession").onclick=function(){
 var c=client(),w=week(); if(!c||!w)return;
 var name=el("newSessionName").value.trim();
 if(!name){alert("Enter a session name.");return;}
 var s={id:uid(),name:name,exercises:[]};
 w.sessions.push(s); c.selectedSessionId=s.id;
 el("sessionCreator").className="card hidden";
 save();renderProgramme();renderWorkout();
};

el("renameProgramme").onclick=function(){
 var p=programme(); if(!p)return;
 el("renameProgrammeName").value=p.name;
 el("renameProgrammeBox").className="card";
};
el("cancelRenameProgramme").onclick=function(){el("renameProgrammeBox").className="card hidden";};
el("saveRenameProgramme").onclick=function(){
 var p=programme(); if(!p)return;
 var name=el("renameProgrammeName").value.trim();
 if(!name){alert("Enter a programme name.");return;}
 p.name=name;
 el("renameProgrammeBox").className="card hidden";
 save();renderProgramme();renderWorkout();
};

el("renameSession").onclick=function(){
 var s=session(); if(!s)return;
 el("renameSessionName").value=s.name;
 el("renameSessionBox").className="card";
};
el("cancelRenameSession").onclick=function(){el("renameSessionBox").className="card hidden";};
el("saveRenameSession").onclick=function(){
 var s=session(); if(!s)return;
 var name=el("renameSessionName").value.trim();
 if(!name){alert("Enter a session name.");return;}
 s.name=name;
 el("renameSessionBox").className="card hidden";
 save();renderProgramme();renderWorkout();
};
el("deleteSession").onclick=function(){
 var c=client(),w=week(),s=session(); if(!c||!w||!s)return;
 if(w.sessions.length===1){alert("A week needs at least one session.");return}
 if(!confirm("Delete "+s.name+"?"))return;
 var idx=-1;for(var i=0;i<w.sessions.length;i++)if(w.sessions[i].id===s.id)idx=i;
 if(idx>=0)w.sessions.splice(idx,1);
 c.selectedSessionId=w.sessions[0].id;
 save();renderProgramme();renderWorkout();
};

el("programmeSelect").onchange=function(){
 var c=client();if(!c)return;
 c.selectedProgrammeId=this.value;
 var p=programme();
 c.selectedWeekId=p.weeks[p.weeks.length-1].id;
 var w=week();
 c.selectedSessionId=w.sessions[0].id;
 save();renderProgramme();renderWorkout();
};
el("weekSelect").onchange=function(){
 var c=client();if(!c)return;
 c.selectedWeekId=this.value;
 var w=week();
 c.selectedSessionId=w.sessions[0].id;
 save();renderProgramme();renderWorkout();
};
el("sessionSelect").onchange=function(){
 var c=client();if(!c)return;
 c.selectedSessionId=this.value;save();renderProgramme();renderWorkout();
};

el("clientProgrammeSelect").onchange=function(){
 var cv=clientViewIds(); if(!cv)return;
 cv.sel.programmeId=this.value;
 var p=getProgramme(cv.c,cv.sel.programmeId);
 if(p&&p.weeks.length){
   cv.sel.weekId=p.weeks[p.weeks.length-1].id;
   cv.sel.sessionId=p.weeks[p.weeks.length-1].sessions[0].id;
 }
 save();renderWorkout();
};
el("clientWeekSelect").onchange=function(){
 var cv=clientViewIds(); if(!cv)return;
 cv.sel.weekId=this.value;
 var w=getWeek(cv.p,cv.sel.weekId);
 if(w&&w.sessions.length)cv.sel.sessionId=w.sessions[0].id;
 save();renderWorkout();
};
el("clientSessionSelect").onchange=function(){
 var cv=clientViewIds(); if(!cv)return;
 cv.sel.sessionId=this.value;
 save();renderWorkout();
};

el("createNextWeek").onclick=function(){
 var c=client(),p=programme(),w=week(); if(!c||!p||!w)return;

 var newNumber=1;
 for(var i=0;i<p.weeks.length;i++){
   if((p.weeks[i].number||0)>=newNumber)newNumber=(p.weeks[i].number||0)+1;
 }

 function copySets(sets){
   var out=[];
   for(var a=0;a<sets.length;a++){
     out.push({kg:sets[a].kg,reps:sets[a].reps,rir:sets[a].rir});
   }
   return out;
 }
 function copyExercises(exercises){
   var out=[];
   for(var b=0;b<exercises.length;b++){
     out.push({
       id:uid(),
       name:exercises[b].name,
       notes:exercises[b].notes||"",
       sets:copySets(exercises[b].sets||[])
     });
   }
   return out;
 }

 var newSessions=[];
 for(var j=0;j<w.sessions.length;j++){
   newSessions.push({
     id:uid(),
     name:w.sessions[j].name,
     exercises:copyExercises(w.sessions[j].exercises||[])
   });
 }

 var nw={id:uid(),number:newNumber,name:"Week "+newNumber,sessions:newSessions};
 p.weeks.push(nw);
 c.selectedWeekId=nw.id;
 c.selectedSessionId=nw.sessions[0].id;
 save();renderProgramme();renderWorkout();
};

el("addExercise").onclick=function(){
 var s=session(); if(!s)return;
 s.exercises.push({id:uid(),name:"",notes:"",sets:[{kg:"",reps:"",rir:""}]});
 save();renderProgramme();
};

function renderProgramme(){
 var c=client();ensureClientData(c);
 el("progFor").textContent=c?"For "+c.name:"";
 if(!c){el("exercises").innerHTML="";return}
 var p=programme(),w=week(),s=session();

 var ps=el("programmeSelect");ps.innerHTML="";
 for(var i=0;i<c.programmes.length;i++){
  var op=document.createElement("option");op.value=c.programmes[i].id;op.textContent=c.programmes[i].name;
  if(c.programmes[i].id===c.selectedProgrammeId)op.selected=true;ps.appendChild(op);
 }

 var ws=el("weekSelect");ws.innerHTML="";
 for(var wi=0;wi<p.weeks.length;wi++){
   var ow=document.createElement("option");ow.value=p.weeks[wi].id;ow.textContent=p.weeks[wi].name||("Week "+(wi+1));
   if(p.weeks[wi].id===c.selectedWeekId)ow.selected=true;ws.appendChild(ow);
 }

 var ss=el("sessionSelect");ss.innerHTML="";
 for(var j=0;j<w.sessions.length;j++){
  var os=document.createElement("option");os.value=w.sessions[j].id;os.textContent=w.sessions[j].name;
  if(w.sessions[j].id===c.selectedSessionId)os.selected=true;ss.appendChild(os);
 }
 el("currentSessionTitle").textContent=(w?w.name+" · ":"")+(s?s.name:"Session");
 var box=el("exercises");box.innerHTML="";
 if(!s)return;
 for(var k=0;k<s.exercises.length;k++)makeExercise(box,s.exercises[k],k,s);
}

function makeExercise(box,ex,index,sess){
 var d=document.createElement("div");d.className="exercise";
 d.innerHTML='<div class="row spread"><input class="ename" placeholder="Exercise name"><button class="danger remex">Remove</button></div><div class="setrow header"><span>Set</span><span>kg</span><span>Reps</span><span>RIR</span><span></span></div><div class="sets"></div><div class="row" style="flex-wrap:wrap"><button class="addset">+ Set</button><button class="copykg">Copy kg ↓</button><button class="copyreps">Copy reps ↓</button><button class="copyrir">Copy RIR ↓</button></div><label>Notes<input class="enotes"></label>';
 d.querySelector(".ename").value=ex.name;d.querySelector(".enotes").value=ex.notes;
 d.querySelector(".ename").onchange=function(){ex.name=this.value;save()};
 d.querySelector(".enotes").onchange=function(){ex.notes=this.value;save()};
 d.querySelector(".remex").onclick=function(){sess.exercises.splice(index,1);save();renderProgramme()};
 var sets=d.querySelector(".sets");
 for(var j=0;j<ex.sets.length;j++)makeSet(sets,ex,j);
 d.querySelector(".addset").onclick=function(){
   var p=ex.sets[ex.sets.length-1]||{kg:"",reps:"",rir:""};
   ex.sets.push({kg:p.kg,reps:p.reps,rir:p.rir});save();renderProgramme()
 };
 d.querySelector(".copykg").onclick=function(){copy(ex,"kg")};
 d.querySelector(".copyreps").onclick=function(){copy(ex,"reps")};
 d.querySelector(".copyrir").onclick=function(){copy(ex,"rir")};
 box.appendChild(d);
}
function makeSet(box,ex,j){
 var s=ex.sets[j],r=document.createElement("div");r.className="setrow";
 r.innerHTML="<span>"+(j+1)+'</span><input class="kg" inputmode="decimal"><input class="reps" inputmode="numeric"><input class="rir" inputmode="decimal"><button>×</button>';
 r.querySelector(".kg").value=s.kg;r.querySelector(".reps").value=s.reps;r.querySelector(".rir").value=s.rir;
 r.querySelector(".kg").onchange=function(){s.kg=this.value;save()};
 r.querySelector(".reps").onchange=function(){s.reps=this.value;save()};
 r.querySelector(".rir").onchange=function(){s.rir=this.value;save()};
 r.querySelector("button").onclick=function(){
   ex.sets.splice(j,1);
   if(!ex.sets.length)ex.sets.push({kg:"",reps:"",rir:""});
   save();renderProgramme()
 };
 box.appendChild(r);
}
function copy(ex,f){
 if(!ex.sets.length)return;
 var v=ex.sets[0][f];
 for(var i=0;i<ex.sets.length;i++)ex.sets[i][f]=v;
 save();renderProgramme()
}

var activeWorkout=null;
el("startWorkout").onclick=function(){
 var c,p,w,s;
 if(state.role==="client"){
   var cv=clientViewIds(); if(!cv)return;
   c=cv.c;p=cv.p;w=cv.w;s=cv.s;
 }else{
   c=client();p=programme();w=week();s=session();
 }
 if(!c||!p||!w||!s||!s.exercises.length){alert("Add an exercise first");return}
 activeWorkout={id:uid(),clientId:c.id,programmeId:p.id,programmeName:p.name,weekId:w.id,weekName:w.name,weekNumber:w.number,sessionId:s.id,session:s.name,started:new Date().toISOString(),exercises:[]};
 for(var i=0;i<s.exercises.length;i++){
   var e=s.exercises[i],ne={name:e.name||"Unnamed exercise",notes:e.notes||"",sets:[]};
   for(var j=0;j<e.sets.length;j++){
     ne.sets.push({kg:e.sets[j].kg,prescribedKg:e.sets[j].kg,reps:"",rir:"",targetReps:e.sets[j].reps,targetRir:e.sets[j].rir,done:false});
   }
   activeWorkout.exercises.push(ne);
 }
 renderWorkout();
};

function renderWorkout(){
 var c=client();ensureClientData(c);
 var p,w,s;
 if(state.role==="client"){
   var cv=clientViewIds();
   if(cv){c=cv.c;p=cv.p;w=cv.w;s=cv.s;}
   el("clientWorkoutChooser").className="";
   var ps=el("clientProgrammeSelect");ps.innerHTML="";
   if(c){
     for(var pi=0;pi<c.programmes.length;pi++){
       var po=document.createElement("option");
       po.value=c.programmes[pi].id;po.textContent=c.programmes[pi].name;
       if(p&&c.programmes[pi].id===p.id)po.selected=true;
       ps.appendChild(po);
     }
   }
   var ws=el("clientWeekSelect");ws.innerHTML="";
   if(p){
     for(var wi=0;wi<p.weeks.length;wi++){
       var wo=document.createElement("option");
       wo.value=p.weeks[wi].id;wo.textContent=p.weeks[wi].name||("Week "+(wi+1));
       if(w&&p.weeks[wi].id===w.id)wo.selected=true;
       ws.appendChild(wo);
     }
   }
   var ss=el("clientSessionSelect");ss.innerHTML="";
   if(w){
     for(var si=0;si<w.sessions.length;si++){
       var so=document.createElement("option");
       so.value=w.sessions[si].id;so.textContent=w.sessions[si].name;
       if(s&&w.sessions[si].id===s.id)so.selected=true;
       ss.appendChild(so);
     }
   }
 }else{
   p=programme();w=week();s=session();
   el("clientWorkoutChooser").className="hidden";
 }
 el("workoutFor").textContent=(c?c.name+" · ":"")+(p?p.name+" · ":"")+(w?w.name+" · ":"")+(s?s.name:"");
 if(!activeWorkout){
   el("workoutArea").innerHTML=s&&s.exercises.length?"<p>Ready to start <b>"+esc(s.name)+"</b>.</p>":'<p class="muted">Build a programme first.</p>';
   el("finishBox").className="hidden";return
 }
 var box=el("workoutArea");box.innerHTML="";
 for(var i=0;i<activeWorkout.exercises.length;i++){
   var e=activeWorkout.exercises[i],d=document.createElement("div");d.className="exercise";
   var noteHtml=e.notes?'<div class="muted" style="margin:5px 0">'+esc(e.notes)+'</div>':"";
   var previous=previousExerciseSummary(activeWorkout.clientId,e.name,activeWorkout.id);
   var prevHtml=previous?'<div class="muted"><b>Last:</b> '+esc(previous)+'</div>':"";
   d.innerHTML='<div class="row spread"><h3>'+esc(e.name)+'</h3><button class="swapEx">Swap</button></div>'+noteHtml+prevHtml+'<div class="setrow header"><span>Set</span><span>kg</span><span>Reps</span><span>RIR</span><span>✓</span></div>';
   for(var j=0;j<e.sets.length;j++)makeWorkoutSet(d,e.sets[j],j,e);
   var add=document.createElement("button");add.textContent="+ Set";add.onclick=(function(ex){return function(){
     var last=ex.sets[ex.sets.length-1]||{kg:"",targetReps:"",targetRir:""};
     ex.sets.push({kg:last.kg,prescribedKg:last.kg,reps:"",rir:"",targetReps:last.targetReps,targetRir:last.targetRir,done:false});
     renderWorkout();
   }})(e);d.appendChild(add);
   d.querySelector(".swapEx").onclick=(function(ex){return function(){
     var n=window.prompt?prompt("Replacement exercise",ex.name):null;
     if(n){ex.originalName=ex.originalName||ex.name;ex.name=n;renderWorkout();}
   }})(e);
   box.appendChild(d)
 }
 el("finishBox").className="";
}
function makeWorkoutSet(box,s,j,exercise){
 var r=document.createElement("div");r.className="setrow";
 r.innerHTML="<span>"+(j+1)+'</span><input class="kg"><input class="reps" placeholder="'+esc(s.targetReps)+'"><input class="rir" placeholder="'+esc(s.targetRir)+'"><button>'+(s.done?"✓":"○")+"</button>";
 r.querySelector(".kg").value=s.kg;r.querySelector(".reps").value=s.reps;r.querySelector(".rir").value=s.rir;
 r.querySelector(".kg").onchange=function(){s.kg=this.value};
 r.querySelector(".reps").onchange=function(){s.reps=this.value};
 r.querySelector(".rir").onchange=function(){s.rir=this.value};
 r.querySelector("button").onclick=function(){
   if(!s.done){
     if(s.kg==="" || s.kg==null) s.kg=s.prescribedKg||s.kg;
     if((s.reps==="" || s.reps==null) && s.targetReps!==undefined) s.reps=s.targetReps;
     if((s.rir==="" || s.rir==null) && s.targetRir!==undefined) s.rir=s.targetRir;
     s.done=true;
   }else{s.done=false;}
   renderWorkout();
 };
 box.appendChild(r);
 var rm=document.createElement("button");rm.textContent="Remove set";rm.className="danger";
 rm.style.margin="0 0 5px 40px";
 rm.onclick=function(){exercise.sets.splice(j,1);renderWorkout();};
 box.appendChild(rm);
}


el("pain").onchange=function(){
 el("painDetails").className=this.value==="Yes"?"":"hidden";
};

function previousExerciseSummary(clientId,name,currentId){
 var target=normaliseName(name);
 for(var h=0;h<state.history.length;h++){
   var hist=state.history[h];
   if(hist.clientId!==clientId || hist.id===currentId)continue;
   for(var e=0;e<hist.exercises.length;e++){
     if(normaliseName(hist.exercises[e].name)!==target)continue;
     var parts=[];
     for(var s=0;s<hist.exercises[e].sets.length;s++){
       var st=hist.exercises[e].sets[s];
       if(st.kg!==""&&st.reps!=="")parts.push(st.kg+"kg × "+st.reps+(st.rir!==""?" @"+st.rir+"RIR":""));
     }
     return parts.join(" · ");
   }
 }
 return "";
}

function num(v){
 var n=parseFloat(v);
 return isNaN(n)?null:n;
}
function normaliseName(s){return String(s||"").toLowerCase().replace(/^\s+|\s+$/g,"");}

function findPRs(workout){
 var prs=[];
 for(var i=0;i<workout.exercises.length;i++){
   var ex=workout.exercises[i];
   var name=normaliseName(ex.name);
   if(!name)continue;

   var prevMaxWeight=null;
   var prevBestRepsByWeight={};

   for(var h=0;h<state.history.length;h++){
     var hist=state.history[h];
     if(hist.clientId!==workout.clientId)continue;
     for(var e=0;e<hist.exercises.length;e++){
       var hex=hist.exercises[e];
       if(normaliseName(hex.name)!==name)continue;
       for(var s=0;s<hex.sets.length;s++){
         var hs=hex.sets[s];
         var hw=num(hs.kg), hr=num(hs.reps);
         if(hw!==null){
           if(prevMaxWeight===null || hw>prevMaxWeight)prevMaxWeight=hw;
           if(hr!==null){
             var key=String(hw);
             if(prevBestRepsByWeight[key]===undefined || hr>prevBestRepsByWeight[key])prevBestRepsByWeight[key]=hr;
           }
         }
       }
     }
   }

   for(var j=0;j<ex.sets.length;j++){
     var st=ex.sets[j];
     var w=num(st.kg), r=num(st.reps);
     if(w===null || r===null)continue;

     if(prevMaxWeight!==null && w>prevMaxWeight){
       prs.push({exercise:ex.name,type:"weight",weight:w,reps:r,previous:prevMaxWeight});
     }else{
       var k=String(w);
       if(prevBestRepsByWeight[k]!==undefined && r>prevBestRepsByWeight[k]){
         prs.push({exercise:ex.name,type:"reps",weight:w,reps:r,previous:prevBestRepsByWeight[k]});
       }
     }
   }
 }
 return prs;
}

function showPRBanner(prs){
 var banner=el("prBanner");
 if(!prs || !prs.length){banner.className="card hidden";return;}
 var pr=prs[0];
 el("prTitle").textContent="New PR";
 if(pr.type==="weight"){
   el("prMessage").textContent=pr.exercise+": "+pr.weight+" kg × "+pr.reps+" — heaviest recorded set.";
 }else{
   el("prMessage").textContent=pr.exercise+": "+pr.weight+" kg × "+pr.reps+" — more reps than your previous best at this weight.";
 }
 if(prs.length>1)el("prMessage").textContent+=" +"+(prs.length-1)+" more PR"+(prs.length>2?"s":"")+" this session.";
 banner.className="card";
}

el("finishWorkout").onclick=function(){
 if(!activeWorkout)return;
 activeWorkout.finished=new Date().toISOString();
 activeWorkout.energy=el("energy").value;
 activeWorkout.sleep=el("sleep").value;
 activeWorkout.sleepQuality=el("sleepQuality").value;
 activeWorkout.pain=el("pain").value;
 activeWorkout.painWhere=activeWorkout.pain==="Yes"?el("painWhere").value:"";
 activeWorkout.painSeverity=activeWorkout.pain==="Yes"?el("painSeverity").value:"";
 activeWorkout.painEffect=activeWorkout.pain==="Yes"?el("painEffect").value:"";
 activeWorkout.notes=el("notes").value;
 var prs=findPRs(activeWorkout);
 activeWorkout.prs=prs;
 state.history.unshift(activeWorkout);
 activeWorkout=null;save();render();
 if(state.role==="coach"){
   show("history");
 }else{
   showPRBanner(prs);
   show("workout");
   showPRBanner(prs);
 }
};

function weekKey(date){
 var d=new Date(date); d.setHours(0,0,0,0);
 var day=(d.getDay()+6)%7; d.setDate(d.getDate()-day);
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function renderAdherence(c){
 var box=el("adherenceSummary");
 if(!c){box.innerHTML="";return;}
 var p=programme(),w=week();
 var target=w&&w.sessions?w.sessions.length:0;
 var completed=0, weeks={}, totalExpected=0;
 for(var i=0;i<state.history.length;i++){
   var h=state.history[i];if(h.clientId!==c.id)continue;
   completed++;
   var wk=weekKey(h.finished||h.started);
   if(!weeks[wk])weeks[wk]={count:0,sessions:{}};
   var sk=h.sessionId||h.session;
   if(!weeks[wk].sessions[sk]){weeks[wk].sessions[sk]=true;weeks[wk].count++;}
 }
 var keys=Object.keys(weeks).sort().reverse();
 var streak=0;
 for(var k=0;k<keys.length;k++){
   if(target>0&&weeks[keys[k]].count>=target)streak++;else break;
 }
 var pct="—";
 if(target>0&&keys.length){
   totalExpected=target*keys.length;
   pct=Math.min(100,Math.round((completed/totalExpected)*100))+"%";
 }
 var current=weekKey(new Date());
 var thisWeek=weeks[current]?weeks[current].count:0;
 box.innerHTML='<div class="row spread" style="flex-wrap:wrap"><div><b>This week</b><div>'+thisWeek+'/'+target+' sessions</div></div><div><b>Completion</b><div>'+pct+'</div></div><div><b>Full-week streak</b><div>'+streak+' week'+(streak===1?"":"s")+'</div></div><div><b>Total sessions</b><div>'+completed+'</div></div></div>';
}

function renderHistory(){
 var hc=client();
 el("historyFor").textContent=hc?(state.role==="client"?"Your completed training · "+hc.name:"Viewing "+hc.name):"";
 renderAdherence(hc);
 var out="",h,i,j,k;
 for(i=0;i<state.history.length;i++){
   h=state.history[i];if(h.clientId!==state.selected)continue;
   out+='<div class="history"><b>'+esc(h.programmeName||"")+(h.weekName?" · "+esc(h.weekName):"")+' · '+esc(h.session)+'</b><div class="muted">'+esc(new Date(h.finished).toLocaleString())+"</div>";
   if(h.prs&&h.prs.length){out+='<div><span class="badge">PR × '+h.prs.length+'</span></div>';}
   for(j=0;j<h.exercises.length;j++){
     var ss=[];
     for(k=0;k<h.exercises[j].sets.length;k++){
       var st=h.exercises[j].sets[k];
       ss.push((st.kg||"—")+"×"+(st.reps||"—")+(st.rir!==""?" @"+st.rir+"RIR":""))
     }
     out+="<p><b>"+esc(h.exercises[j].name)+"</b><br><span class='muted'>"+esc(ss.join(" · "))+"</span></p>"
   }
   out+="<div class='muted'>Energy: "+esc(h.energy)+" · Sleep: "+esc(h.sleep||"—")+" ("+esc(h.sleepQuality||"—")+") · Pain: "+esc(h.pain)+(h.pain==="Yes"&&h.painWhere?" — "+esc(h.painWhere)+" "+esc(h.painSeverity||"—")+"/10, "+esc(h.painEffect||""):"")+(h.notes?" · "+esc(h.notes):"")+"</div></div>"
 }
 el("historyList").innerHTML=out||'<p class="muted">No completed sessions yet.</p>';
}

function render(){renderRole();renderClients();renderProgramme();renderWorkout();renderHistory()}

async function loadAuthenticatedProfile(user){
 var result=await sb.from("profiles").select("id,display_name,role").eq("id",user.id).single();
 if(result.error) throw result.error;
 authProfile=result.data;
 state.role=authProfile.role;
 save();
 var bar=el("accountBar");
 bar.innerHTML=esc(authProfile.display_name||user.email)+" · "+esc(authProfile.role)+" <button id='signOutButton' class='accountBtn'>Sign out</button>";
 el("signOutButton").onclick=async function(){await sb.auth.signOut();location.reload();};
 el("authGate").classList.add("hidden");
 ensureClientData(client());save();render();
}

async function bootAuth(){
 try{
  var sess=await sb.auth.getSession();
  if(sess.data.session){await loadAuthenticatedProfile(sess.data.session.user);}
 }catch(err){el("authError").textContent=err.message||String(err);}
}

el("loginButton").onclick=async function(){
 el("authError").textContent="";
 var email=el("loginEmail").value.trim(), password=el("loginPassword").value;
 if(!email||!password){el("authError").textContent="Enter your email and password.";return;}
 el("loginButton").disabled=true; el("loginButton").textContent="Signing in…";
 var result=await sb.auth.signInWithPassword({email:email,password:password});
 if(result.error){el("authError").textContent=result.error.message;el("loginButton").disabled=false;el("loginButton").textContent="Sign in";return;}
 try{await loadAuthenticatedProfile(result.data.user);}catch(err){el("authError").textContent=err.message||String(err);}
 el("loginButton").disabled=false;el("loginButton").textContent="Sign in";
};

el("loginPassword").addEventListener("keydown",function(e){if(e.key==="Enter")el("loginButton").click();});
bootAuth();
})();
