async function boot(user){let r=await sb.from('profiles').select('id,display_name,role').eq('id',user.id).single();if(r.error)return err(r.error);profile=r.data;$('who').textContent=(profile.display_name||user.email)+' · '+profile.role;$('auth').classList.add('hidden');$('main').classList.remove('hidden');$('signout').classList.remove('hidden');if(profile.role==='coach'){await loadClients()}else{selectedClient={id:profile.id,name:profile.display_name||user.email};$('tabs').querySelector('[data-v="clients"]').classList.add('hidden');$('tabs').querySelector('[data-v="programme"]').classList.add('hidden');show('workout');await loadTree(profile.id)}}

async function loadTree(cid){msg('Syncing…');let pr=await sb.from('programmes').select('id,name,goal,status,start_date').eq('client_id',cid).order('created_at');if(pr.error)return err(pr.error);tree=pr.data.map(p=>({...p,weeks:[]}));for(const p of tree){let wr=await sb.from('programme_weeks').select('id,week_number,name,notes').eq('programme_id',p.id).order('week_number');if(wr.error)return err(wr.error);p.weeks=wr.data.map(w=>({...w,sessions:[]}));for(const w of p.weeks){let sr=await sb.from('sessions').select('id,name,position,notes').eq('week_id',w.id).order('position');if(sr.error)return err(sr.error);w.sessions=sr.data.map(s=>({...s,exercises:[]}));for(const s of w.sessions){let er=await sb.from('session_exercises').select('id,exercise_name,position,coach_notes').eq('session_id',s.id).order('position');if(er.error)return err(er.error);s.exercises=er.data.map(e=>({...e,sets:[]}));for(const e of s.exercises){let rr=await sb.from('prescribed_sets').select('id,set_number,target_load_kg,target_reps,target_rir,notes').eq('session_exercise_id',e.id).order('set_number');if(rr.error)return err(rr.error);e.sets=rr.data}}}}if(!sel.p||!tree.some(x=>x.id===sel.p))sel.p=tree[0]?.id||null;normalizeSelection();await loadHistory();renderAll();msg('Synced.')}

function renderProgramme(){if(!selectedClient)return;normalizeSelection();let {p,w,s}=cur();$('progFor').textContent='For '+selectedClient.name;fill('programmeSelect',tree,'name','id',p?.id);fill('weekSelect',p?.weeks,'name','id',w?.id);fill('sessionSelect',w?.sessions,'name','id',s?.id);$('currentSessionTitle').textContent=(w?w.name+' · ':'')+(s?s.name:'Session');let coach=profile.role==='coach';$('coachProgButtons').classList.toggle('hidden',!coach);$('addExercise').classList.toggle('hidden',!coach);let box=$('exercises');box.innerHTML='';if(!p){box.innerHTML=coach?'<p class="muted">No programme yet. Click + Programme.</p>':'<p class="muted">Your coach has not published a programme yet.</p>';return}if(!s)return;(s.exercises||[]).forEach((e,i)=>makeExercise(box,e,i,s,coach))}
function makeExercise(box,e,i,s,coach){let d=document.createElement('div');d.className='exercise';if(!coach){d.innerHTML='<h3>'+esc(e.exercise_name)+'</h3>'+(e.coach_notes?'<div class="muted">'+esc(e.coach_notes)+'</div>':'')+'<div class="setrow header"><span>Set</span><span>kg</span><span>Reps</span><span>RIR</span><span></span></div>';e.sets.forEach(st=>{d.innerHTML+='<div class="setrow"><span>'+st.set_number+'</span><span>'+ (st.target_load_kg??'—')+'</span><span>'+(st.target_reps??'—')+'</span><span>'+(st.target_rir??'—')+'</span><span></span></div>'});box.appendChild(d);return}d.innerHTML='<div class="row spread"><input class="ename" placeholder="Exercise name"><button class="danger remex">Remove</button></div><div class="setrow header"><span>Set</span><span>kg</span><span>Reps</span><span>RIR</span><span></span></div><div class="sets"></div><div class="row" style="flex-wrap:wrap"><button class="addset">+ Set</button><button class="copykg">Copy kg ↓</button><button class="copyreps">Copy reps ↓</button><button class="copyrir">Copy RIR ↓</button></div><label>Notes<input class="enotes"></label>';d.querySelector('.ename').value=e.exercise_name;d.querySelector('.enotes').value=e.coach_notes||'';d.querySelector('.ename').onchange=async function(){let r=await sb.from('session_exercises').update({exercise_name:this.value}).eq('id',e.id);if(r.error)err(r.error);else e.exercise_name=this.value};d.querySelector('.enotes').onchange=async function(){let r=await sb.from('session_exercises').update({coach_notes:this.value}).eq('id',e.id);if(r.error)err(r.error);else e.coach_notes=this.value};d.querySelector('.remex').onclick=async()=>{if(!confirm('Remove exercise?'))return;let r=await sb.from('session_exercises').delete().eq('id',e.id);if(r.error)return err(r.error);await loadTree(selectedClient.id)};let sets=d.querySelector('.sets');e.sets.forEach((st,j)=>makeSet(sets,e,st,j));d.querySelector('.addset').onclick=async()=>{let last=e.sets[e.sets.length-1]||{},r=await sb.from('prescribed_sets').insert({session_exercise_id:e.id,set_number:e.sets.length+1,target_load_kg:last.target_load_kg??null,target_reps:last.target_reps??null,target_rir:last.target_rir??null});if(r.error)return err(r.error);await loadTree(selectedClient.id)};for(const [cl,f] of [['copykg','target_load_kg'],['copyreps','target_reps'],['copyrir','target_rir']])d.querySelector('.'+cl).onclick=async()=>{if(!e.sets.length)return;let v=e.sets[0][f];for(let k=1;k<e.sets.length;k++){let u=await sb.from('prescribed_sets').update({[f]:v}).eq('id',e.sets[k].id);if(u.error)return err(u.error)}await loadTree(selectedClient.id)};box.appendChild(d)}
function makeSet(box,e,st,j){let r=document.createElement('div');r.className='setrow';r.innerHTML='<span>'+(j+1)+'</span><input class="kg" inputmode="decimal"><input class="reps" inputmode="numeric"><input class="rir" inputmode="decimal"><button>×</button>';r.querySelector('.kg').value=st.target_load_kg??'';r.querySelector('.reps').value=st.target_reps??'';r.querySelector('.rir').value=st.target_rir??'';for(const [cl,f] of [['kg','target_load_kg'],['reps','target_reps'],['rir','target_rir']])r.querySelector('.'+cl).onchange=async function(){let v=this.value===''?null:Number(this.value),u=await sb.from('prescribed_sets').update({[f]:v}).eq('id',st.id);if(u.error)err(u.error);else st[f]=v};r.querySelector('button').onclick=async()=>{if(e.sets.length===1)return alert('Keep at least one set.');let d=await sb.from('prescribed_sets').delete().eq('id',st.id);if(d.error)return err(d.error);for(let k=j+1;k<e.sets.length;k++)await sb.from('prescribed_sets').update({set_number:k}).eq('id',e.sets[k].id);await loadTree(selectedClient.id)};box.appendChild(r)}

$('newProgramme').onclick=async()=>{let name=prompt('Programme name');if(!name)return;let goal=prompt('Goal','')||'';let r=await sb.from('programmes').insert({coach_id:profile.id,client_id:selectedClient.id,name,goal,status:'active'}).select('id').single();if(r.error)return err(r.error);let w=await sb.from('programme_weeks').insert({programme_id:r.data.id,week_number:1,name:'Week 1'}).select('id').single();if(w.error)return err(w.error);let s=await sb.from('sessions').insert({week_id:w.data.id,name:'Session 1',position:1});if(s.error)return err(s.error);sel.p=r.data.id;await loadTree(selectedClient.id)};
$('newSession').onclick=async()=>{let {w}=cur();if(!w)return;let name=prompt('Session name');if(!name)return;let r=await sb.from('sessions').insert({week_id:w.id,name,position:w.sessions.length+1});if(r.error)return err(r.error);await loadTree(selectedClient.id)};$('renameProgramme').onclick=async()=>{let {p}=cur();if(!p)return;let name=prompt('Programme name',p.name);if(!name)return;let r=await sb.from('programmes').update({name}).eq('id',p.id);if(r.error)return err(r.error);await loadTree(selectedClient.id)};$('renameSession').onclick=async()=>{let {s}=cur();if(!s)return;let name=prompt('Session name',s.name);if(!name)return;let r=await sb.from('sessions').update({name}).eq('id',s.id);if(r.error)return err(r.error);await loadTree(selectedClient.id)};$('deleteSession').onclick=async()=>{let {s}=cur();if(!s||!confirm('Delete '+s.name+'?'))return;let r=await sb.from('sessions').delete().eq('id',s.id);if(r.error)return err(r.error);await loadTree(selectedClient.id)};
$('createNextWeek').onclick=async()=>{let {p,w}=cur();if(!p||!w)return;let n=Math.max(...p.weeks.map(x=>x.week_number))+1,wr=await sb.from('programme_weeks').insert({programme_id:p.id,week_number:n,name:'Week '+n,notes:w.notes}).select('id').single();if(wr.error)return err(wr.error);for(const s of w.sessions){let sr=await sb.from('sessions').insert({week_id:wr.data.id,name:s.name,position:s.position,notes:s.notes}).select('id').single();if(sr.error)return err(sr.error);for(const e of s.exercises){let er=await sb.from('session_exercises').insert({session_id:sr.data.id,exercise_name:e.exercise_name,position:e.position,coach_notes:e.coach_notes}).select('id').single();if(er.error)return err(er.error);if(e.sets.length){let rows=e.sets.map(st=>({session_exercise_id:er.data.id,set_number:st.set_number,target_load_kg:st.target_load_kg,target_reps:st.target_reps,target_rir:st.target_rir,notes:st.notes})),rr=await sb.from('prescribed_sets').insert(rows);if(rr.error)return err(rr.error)}}}sel.w=wr.data.id;sel.s=null;await loadTree(selectedClient.id)};
$('addExercise').onclick=async()=>{let {s}=cur();if(!s)return;let name=prompt('Exercise name');if(!name)return;let er=await sb.from('session_exercises').insert({session_id:s.id,exercise_name:name,position:s.exercises.length+1}).select('id').single();if(er.error)return err(er.error);let rr=await sb.from('prescribed_sets').insert({session_exercise_id:er.data.id,set_number:1});if(rr.error)return err(rr.error);await loadTree(selectedClient.id)};
function renderWorkout(){if(!selectedClient)return;let {p,w,s}=cur();fill('clientProgrammeSelect',tree,'name','id',p?.id);fill('clientWeekSelect',p?.weeks,'name','id',w?.id);fill('clientSessionSelect',w?.sessions,'name','id',s?.id);$('workoutFor').textContent=(p?p.name+' · ':'')+(w?w.name+' · ':'')+(s?s.name:'');$('startWorkout').classList.toggle('hidden',profile.role!=='client');if(!activeWorkout){$('workoutArea').innerHTML=s?.exercises.length?'<p>Ready to start <b>'+esc(s.name)+'</b>.</p>':'<p class="muted">No session selected.</p>';$('finishBox').classList.add('hidden');return}let box=$('workoutArea');box.innerHTML='';activeWorkout.exercises.forEach((e,ei)=>{let d=document.createElement('div');d.className='exercise';let prev=previousSummary(e.name);d.innerHTML='<div class="row spread"><h3>'+esc(e.name)+'</h3><button class="swapEx">Swap</button></div>'+(e.notes?'<div class="muted">'+esc(e.notes)+'</div>':'')+(prev?'<div class="muted"><b>Last:</b> '+esc(prev)+'</div>':'')+'<div class="setrow header"><span>Set</span><span>kg</span><span>Reps</span><span>RIR</span><span>✓</span></div>';e.sets.forEach((st,j)=>makeWorkoutSet(d,e,st,j));let add=document.createElement('button');add.textContent='+ Set';add.onclick=()=>{let x=e.sets[e.sets.length-1]||{};e.sets.push({prescribedId:null,kg:x.kg??'',prescribedKg:x.prescribedKg??'',reps:'',rir:'',targetReps:x.targetReps??'',targetRir:x.targetRir??'',done:false,substituted:!!e.originalName});renderWorkout()};d.appendChild(add);d.querySelector('.swapEx').onclick=()=>{let n=prompt('Replacement exercise',e.name);if(n){e.originalName=e.originalName||e.name;e.name=n;e.sets.forEach(x=>x.substituted=true);renderWorkout()}};box.appendChild(d)});$('finishBox').classList.remove('hidden')}
$('clientProgrammeSelect').onchange=()=>{sel.p=$('clientProgrammeSelect').value;sel.w=null;sel.s=null;normalizeSelection();renderAll()};$('clientWeekSelect').onchange=()=>{sel.w=$('clientWeekSelect').value;sel.s=null;normalizeSelection();renderAll()};$('clientSessionSelect').onchange=()=>{sel.s=$('clientSessionSelect').value;renderAll()};
$('startWorkout').onclick=async()=>{let {p,w,s}=cur();if(profile.role!=='client'||!s?.exercises.length)return;let r=await sb.from('workouts').insert({client_id:profile.id,session_id:s.id,status:'in_progress',started_at:new Date().toISOString()}).select('id').single();if(r.error)return err(r.error);activeWorkout={id:r.data.id,p,w,s,exercises:s.exercises.map(e=>({name:e.exercise_name,notes:e.coach_notes||'',sets:e.sets.map(st=>({prescribedId:st.id,kg:st.target_load_kg??'',prescribedKg:st.target_load_kg??'',reps:'',rir:'',targetReps:st.target_reps??'',targetRir:st.target_rir??'',done:false,substituted:false}))}))};renderWorkout()};
function makeWorkoutSet(box,e,st,j){let r=document.createElement('div');r.className='setrow';r.innerHTML='<span>'+(j+1)+'</span><input class="kg"><input class="reps" placeholder="'+esc(st.targetReps)+'"><input class="rir" placeholder="'+esc(st.targetRir)+'"><button>'+(st.done?'✓':'○')+'</button>';r.querySelector('.kg').value=st.kg;r.querySelector('.reps').value=st.reps;r.querySelector('.rir').value=st.rir;r.querySelector('.kg').onchange=function(){st.kg=this.value};r.querySelector('.reps').onchange=function(){st.reps=this.value};r.querySelector('.rir').onchange=function(){st.rir=this.value};r.querySelector('button').onclick=()=>{if(!st.done){if(st.kg===''||st.kg==null)st.kg=st.prescribedKg;if(st.reps==='')st.reps=st.targetReps;if(st.rir==='')st.rir=st.targetRir;st.done=true}else st.done=false;renderWorkout()};box.appendChild(r);let rm=document.createElement('button');rm.textContent='Remove set';rm.className='danger';rm.style.margin='0 0 5px 40px';rm.onclick=()=>{e.sets.splice(j,1);renderWorkout()};box.appendChild(rm)}

async function loadHistory(){if(!selectedClient)return;let wr=await sb.from('workouts').select('id,session_id,started_at,completed_at,status,client_notes').eq('client_id',selectedClient.id).eq('status','completed').order('completed_at',{ascending:false});if(wr.error)return err(wr.error);history=[];for(const w of wr.data){let cs=await sb.from('completed_sets').select('exercise_name,set_number,load_kg,reps,rir,completed,substituted').eq('workout_id',w.id).order('created_at');if(cs.error)return err(cs.error);let fb=await sb.from('session_feedback').select('*').eq('workout_id',w.id).maybeSingle();if(fb.error)return err(fb.error);history.push({...w,sets:cs.data,feedback:fb.data})}}
function previousSummary(name){let target=name.trim().toLowerCase();for(const h of history){let rows=h.sets.filter(x=>x.exercise_name.trim().toLowerCase()===target&&x.completed);if(rows.length)return rows.map(x=>(x.load_kg??'—')+'kg × '+(x.reps??'—')+(x.rir!=null?' @'+x.rir+'RIR':'')).join(' · ')}return''}
function findPRs(){let prs=[];for(const e of activeWorkout.exercises){let prev=history.flatMap(h=>h.sets).filter(x=>x.exercise_name.trim().toLowerCase()===e.name.trim().toLowerCase()&&x.completed),max=prev.reduce((m,x)=>x.load_kg!=null?Math.max(m,x.load_kg):m,-Infinity);for(const st of e.sets.filter(x=>x.done)){let kg=num(st.kg),reps=num(st.reps);if(kg==null||reps==null)continue;if(max>-Infinity&&kg>max)prs.push(e.name+': '+kg+' kg × '+reps+' — weight PR');else{let best=prev.filter(x=>Number(x.load_kg)===kg).reduce((m,x)=>Math.max(m,Number(x.reps)||0),0);if(best&&reps>best)prs.push(e.name+': '+kg+' kg × '+reps+' — rep PR')}}}return prs}
$('finishWorkout').onclick=async()=>{if(!activeWorkout)return;let rows=[];activeWorkout.exercises.forEach(e=>e.sets.forEach((st,j)=>rows.push({workout_id:activeWorkout.id,prescribed_set_id:st.prescribedId,exercise_name:e.name,set_number:j+1,load_kg:num(st.kg),reps:num(st.reps),rir:num(st.rir),completed:!!st.done,substituted:!!st.substituted})));if(rows.length){let r=await sb.from('completed_sets').insert(rows);if(r.error)return err(r.error)}let pain=$('pain').value==='Yes',f=await sb.from('session_feedback').insert({workout_id:activeWorkout.id,energy:$('energy').value.toLowerCase(),sleep_hours_band:$('sleep').value,sleep_quality:$('sleepQuality').value.toLowerCase(),pain_reported:pain,pain_location:pain?$('painWhere').value:null,pain_severity:pain?(num($('painSeverity').value)||0):null,pain_effect:pain?($('painEffect').value==='No'?'none':$('painEffect').value.toLowerCase()):'none',notes:$('notes').value});if(f.error)return err(f.error);let u=await sb.from('workouts').update({status:'completed',completed_at:new Date().toISOString(),client_notes:$('notes').value}).eq('id',activeWorkout.id);if(u.error)return err(u.error);let prs=findPRs();activeWorkout=null;await loadHistory();renderAll();if(prs.length){$('prMessage').textContent=prs.join(' · ');$('prBanner').classList.remove('hidden')}show('history')};
function renderHistory(){if(!selectedClient)return;$('historyFor').textContent=(profile.role==='client'?'Your completed training':'Viewing '+selectedClient.name);let box=$('historyList');box.innerHTML='';history.forEach(h=>{let d=document.createElement('div');d.className='history';let by={};h.sets.forEach(x=>(by[x.exercise_name]||(by[x.exercise_name]=[])).push(x));d.innerHTML='<b>'+esc(new Date(h.completed_at).toLocaleString())+'</b>';Object.entries(by).forEach(([n,sets])=>{d.innerHTML+='<p><b>'+esc(n)+'</b><br><span class="muted">'+sets.map(x=>(x.load_kg??'—')+'×'+(x.reps??'—')+(x.rir!=null?' @'+x.rir+'RIR':'')).join(' · ')+'</span></p>'});if(h.feedback)d.innerHTML+='<div class="muted">Energy: '+esc(h.feedback.energy)+' · Sleep: '+esc(h.feedback.sleep_hours_band)+' ('+esc(h.feedback.sleep_quality)+') · Pain: '+(h.feedback.pain_reported?'Yes — '+esc(h.feedback.pain_location||'')+' '+esc(h.feedback.pain_severity??'')+'/10':'No')+'</div>';box.appendChild(d)});if(!history.length)box.innerHTML='<p class="muted">No completed sessions yet.</p>';let {w}=cur(),target=w?.sessions.length||0;let now=new Date(),monday=new Date(now);monday.setDate(now.getDate()-((now.getDay()+6)%7));monday.setHours(0,0,0,0);let thisWeek=history.filter(h=>new Date(h.completed_at)>=monday).length;$('adherenceSummary').innerHTML='<div class="row spread"><div><b>This week</b><div>'+thisWeek+'/'+target+' sessions</div></div><div><b>Total sessions</b><div>'+history.length+'</div></div></div>'}
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('activeView'));$(v).classList.add('activeView');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.v===v));renderAll()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.v));
sb.auth.getSession().then(({data})=>{if(data.session)boot(data.session.user)});if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');
})();</script></body></html>
