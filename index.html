<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Coach Copilot V3.1</title><link rel="manifest" href="./manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.card{background:#fff;border:1px solid #d1d5db;border-radius:14px;padding:14px;margin:10px 0}.row{display:flex;gap:8px;align-items:center}.spread{justify-content:space-between}.muted{color:#6b7280;font-size:13px}.ok{color:#166534}.err{color:#b91c1c}.hidden{display:none!important}button,input,select,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:9px;background:#fff}button{cursor:pointer}.primary{background:#111827;color:#fff;border-color:#111827}.danger{color:#b91c1c}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sets{display:grid;grid-template-columns:48px 1fr 1fr 1fr 44px;gap:6px;align-items:center;margin:6px 0}.exercise{border-top:1px solid #e5e7eb;padding-top:12px;margin-top:12px}label{display:block;font-size:13px;color:#4b5563;margin:8px 0}label input,label textarea,label select{width:100%;margin-top:4px}h1,h2,h3{margin:4px 0 8px}.pill{font-size:12px;border-radius:99px;padding:4px 8px;background:#e5e7eb}.auth{position:fixed;inset:0;background:#f3f4f6;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.auth .card{width:min(420px,100%)}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.sets{grid-template-columns:36px 1fr 1fr 1fr 38px}}
</style></head><body>
<div id="auth" class="auth"><div class="card"><h1>Coach Copilot</h1><div class="muted">V3.1.1 · Supabase cloud programme delivery</div><label>Email<input id="email" type="email" autocomplete="email"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="login" class="primary">Sign in</button><div id="authMsg" class="err" style="margin-top:8px"></div></div></div>
<div class="wrap"><div class="top"><div><h1>Coach Copilot</h1><div id="who" class="muted"></div></div><div class="row"><span class="pill">V3.1 cloud</span><button id="logout">Sign out</button></div></div><div id="msg" class="muted"></div>
<section id="coach" class="hidden"><div class="card"><div class="row spread"><div><h2>Clients</h2><div class="muted">Only clients linked to your coach account are shown.</div></div><button id="refresh">Refresh</button></div><div id="clients"></div></div></section>
<section id="workspace" class="hidden"><div class="card"><div class="row spread"><div><h2 id="clientName">Programme</h2><div id="clientGoal" class="muted"></div></div><button id="newProgramme" class="primary">+ Programme</button></div><div class="grid"><label>Programme<select id="programmes"></select></label><label>Week<select id="weeks"></select></label><label>Session<select id="sessions"></select></label></div><div class="row" style="flex-wrap:wrap"><button id="newWeek">+ Week</button><button id="newSession">+ Session</button><button id="renameSession">Rename session</button></div></div><div id="exercises"></div><button id="addExercise" class="primary">+ Exercise</button></section>
<section id="empty" class="card hidden"><h2>No programme assigned</h2><p class="muted">Your coach has not published a programme to this account yet.</p></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(function(){"use strict";
const URL="https://ysalexpeiynndagqufpl.supabase.co", KEY="sb_publishable_hzOjhsD7DYoQy2g9Jg1ufA_T8MBs9im", sb=window.supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id); let profile=null, clients=[], selectedClient=null, tree=[];
function message(t,bad){$("msg").textContent=t||"";$("msg").className=bad?"err":"muted"} function fail(e){message(e.message||String(e),true);throw e}
async function oneProfile(user){let r=await sb.from("profiles").select("id,display_name,role").eq("id",user.id).single();if(r.error)fail(r.error);return r.data}
async function boot(user){profile=await oneProfile(user);$("who").textContent=(profile.display_name||user.email)+" · "+profile.role;$("auth").classList.add("hidden");if(profile.role==="coach"){$("coach").classList.remove("hidden");await loadClients()}else{selectedClient={id:profile.id,name:profile.display_name||user.email,goal:""};await loadTree(profile.id);}}
async function loadClients(){message("Loading clients…");let r=await sb.from("coach_clients").select("client_id,status").eq("coach_id",profile.id).eq("status","active");if(r.error)fail(r.error);let ids=r.data.map(x=>x.client_id);clients=[];if(ids.length){let p=await sb.from("profiles").select("id,display_name").in("id",ids);if(p.error)fail(p.error);clients=p.data.map(x=>({id:x.id,name:x.display_name||"Client",goal:""}));}renderClients();message(clients.length?"Cloud connection active.":"No active clients linked yet.");}
function renderClients(){let b=$("clients");b.innerHTML="";clients.forEach(c=>{let d=document.createElement("div");d.className="row spread";d.style.padding="10px 0";d.innerHTML="<div><b></b><div class='muted'>Active client</div></div><button>Select</button>";d.querySelector("b").textContent=c.name;d.querySelector("button").onclick=()=>{selectedClient=c;loadTree(c.id)};b.appendChild(d)});}
async function loadTree(clientId){message("Loading cloud programme…");let pr=await sb.from("programmes").select("id,name,goal,status,start_date").eq("client_id",clientId).order("created_at");if(pr.error)fail(pr.error);tree=pr.data.map(p=>({...p,weeks:[]}));for(const p of tree){let wr=await sb.from("programme_weeks").select("id,week_number,name,notes").eq("programme_id",p.id).order("week_number");if(wr.error)fail(wr.error);p.weeks=wr.data.map(w=>({...w,sessions:[]}));for(const w of p.weeks){let sr=await sb.from("sessions").select("id,name,position,notes").eq("week_id",w.id).order("position");if(sr.error)fail(sr.error);w.sessions=sr.data.map(s=>({...s,exercises:[]}));for(const s of w.sessions){let er=await sb.from("session_exercises").select("id,exercise_name,position,coach_notes").eq("session_id",s.id).order("position");if(er.error)fail(er.error);s.exercises=er.data.map(e=>({...e,sets:[]}));for(const e of s.exercises){let rr=await sb.from("prescribed_sets").select("id,set_number,target_load_kg,target_reps,target_rir,notes").eq("session_exercise_id",e.id).order("set_number");if(rr.error)fail(rr.error);e.sets=rr.data;}}}}renderWorkspace();message("Synced from Supabase.");}
function current(){let p=tree.find(x=>x.id===$("programmes").value)||tree[0];let w=p&&(p.weeks.find(x=>x.id===$("weeks").value)||p.weeks[0]);let s=w&&(w.sessions.find(x=>x.id===$("sessions").value)||w.sessions[0]);return {p,w,s}}
function fill(sel,arr,label,id){let old=sel.value;sel.innerHTML="";(arr||[]).forEach(x=>{let o=document.createElement("option");o.value=x[id];o.textContent=x[label]||"Untitled";sel.appendChild(o)});if([...sel.options].some(o=>o.value===old))sel.value=old}
function renderWorkspace(){let isCoach=profile&&profile.role==="coach";$("workspace").classList.toggle("hidden",!selectedClient||(!tree.length&&!isCoach));$("empty").classList.toggle("hidden",!selectedClient||tree.length>0||isCoach);if(!selectedClient)return;$("clientName").textContent=selectedClient.name;if(!tree.length){if(isCoach){$("clientGoal").textContent="No programme assigned yet — create one below.";$("programmes").innerHTML="";$("weeks").innerHTML="";$("sessions").innerHTML="";$("exercises").innerHTML="";}return;}$("clientGoal").textContent="";fill($("programmes"),tree,"name","id");let {p}=current();fill($("weeks"),p.weeks,"name","id");let c=current();fill($("sessions"),c.w?c.w.sessions:[],"name","id");renderExercises();if(profile.role!=="coach"){["newProgramme","newWeek","newSession","renameSession","addExercise"].forEach(id=>$(id).classList.add("hidden"));}}
function renderExercises(){let {s}=current(),box=$("exercises");box.innerHTML="";if(!s)return;(s.exercises||[]).forEach((e,idx)=>{let d=document.createElement("div");d.className="card exercise";let head=document.createElement("div");head.className="row spread";let title=document.createElement("h3");title.textContent=e.exercise_name;head.appendChild(title);if(profile.role==="coach"){let rm=document.createElement("button");rm.textContent="Remove";rm.className="danger";rm.onclick=()=>removeExercise(e);head.appendChild(rm)}d.appendChild(head);if(e.coach_notes){let n=document.createElement("div");n.className="muted";n.textContent=e.coach_notes;d.appendChild(n)}let hdr=document.createElement("div");hdr.className="sets muted";hdr.innerHTML="<span>Set</span><span>kg</span><span>Reps</span><span>RIR</span><span></span>";d.appendChild(hdr);e.sets.forEach(st=>{let r=document.createElement("div");r.className="sets";[st.set_number,st.target_load_kg??"—",st.target_reps??"—",st.target_rir??"—"].forEach(v=>{let x=document.createElement("span");x.textContent=v;r.appendChild(x)});r.appendChild(document.createElement("span"));d.appendChild(r)});if(profile.role==="coach"){let edit=document.createElement("button");edit.textContent="Edit prescription";edit.onclick=()=>editExercise(e);d.appendChild(edit)}box.appendChild(d)});}
$("programmes").onchange=renderWorkspace;$("weeks").onchange=()=>{let {p}=current();fill($("sessions"),current().w?current().w.sessions:[],"name","id");renderExercises()};$("sessions").onchange=renderExercises;
$("newProgramme").onclick=async()=>{let name=prompt("Programme name");if(!name)return;let r=await sb.from("programmes").insert({coach_id:profile.id,client_id:selectedClient.id,name,status:"active"}).select("id").single();if(r.error)return fail(r.error);let w=await sb.from("programme_weeks").insert({programme_id:r.data.id,week_number:1,name:"Week 1"}).select("id").single();if(w.error)return fail(w.error);let s=await sb.from("sessions").insert({week_id:w.data.id,name:"Session 1",position:1});if(s.error)return fail(s.error);await loadTree(selectedClient.id)};
$("newWeek").onclick=async()=>{let {p}=current();if(!p)return;let n=Math.max(0,...p.weeks.map(w=>w.week_number))+1;let w=await sb.from("programme_weeks").insert({programme_id:p.id,week_number:n,name:"Week "+n}).select("id").single();if(w.error)return fail(w.error);let s=await sb.from("sessions").insert({week_id:w.data.id,name:"Session 1",position:1});if(s.error)return fail(s.error);await loadTree(selectedClient.id)};
$("newSession").onclick=async()=>{let {w}=current();if(!w)return;let name=prompt("Session name","Session "+(w.sessions.length+1));if(!name)return;let r=await sb.from("sessions").insert({week_id:w.id,name,position:w.sessions.length+1});if(r.error)return fail(r.error);await loadTree(selectedClient.id)};
$("renameSession").onclick=async()=>{let {s}=current();if(!s)return;let name=prompt("Session name",s.name);if(!name)return;let r=await sb.from("sessions").update({name}).eq("id",s.id);if(r.error)return fail(r.error);await loadTree(selectedClient.id)};
$("addExercise").onclick=async()=>{let {s}=current();if(!s)return;let name=prompt("Exercise name");if(!name)return;let r=await sb.from("session_exercises").insert({session_id:s.id,exercise_name:name,position:s.exercises.length+1,coach_notes:""}).select("id").single();if(r.error)return fail(r.error);let st=await sb.from("prescribed_sets").insert({session_exercise_id:r.data.id,set_number:1});if(st.error)return fail(st.error);await loadTree(selectedClient.id)};
async function removeExercise(e){if(!confirm("Remove "+e.exercise_name+"?"))return;let r=await sb.from("session_exercises").delete().eq("id",e.id);if(r.error)return fail(r.error);await loadTree(selectedClient.id)}
async function editExercise(e){let name=prompt("Exercise name",e.exercise_name);if(!name)return;let notes=prompt("Coach notes",e.coach_notes||"")??e.coach_notes;let count=parseInt(prompt("Number of sets",String(Math.max(1,e.sets.length))),10);if(!count||count<1)return;let rows=[];for(let i=0;i<count;i++){let old=e.sets[i]||e.sets[e.sets.length-1]||{};let kg=prompt("Set "+(i+1)+" — kg",old.target_load_kg??"");let reps=prompt("Set "+(i+1)+" — reps",old.target_reps??"");let rir=prompt("Set "+(i+1)+" — RIR",old.target_rir??"");rows.push({session_exercise_id:e.id,set_number:i+1,target_load_kg:kg===""?null:Number(kg),target_reps:reps===""?null:Number(reps),target_rir:rir===""?null:Number(rir)})}let u=await sb.from("session_exercises").update({exercise_name:name,coach_notes:notes}).eq("id",e.id);if(u.error)return fail(u.error);let d=await sb.from("prescribed_sets").delete().eq("session_exercise_id",e.id);if(d.error)return fail(d.error);let ins=await sb.from("prescribed_sets").insert(rows);if(ins.error)return fail(ins.error);await loadTree(selectedClient.id)}
$("refresh").onclick=loadClients;$("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};$("login").onclick=async()=>{$("authMsg").textContent="";let r=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error){$("authMsg").textContent=r.error.message;return}try{await boot(r.data.user)}catch(e){$("authMsg").textContent=e.message||String(e)}};$("password").addEventListener("keydown",e=>{if(e.key==="Enter")$("login").click()});
(async()=>{let s=await sb.auth.getSession();if(s.data.session)try{await boot(s.data.session.user)}catch(e){$("authMsg").textContent=e.message||String(e)}})();
})();</script><script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));</script></body></html>
